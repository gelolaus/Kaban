<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kaban storage sync spike</title>
  </head>
  <body>
    <main id="content" tabindex="-1">
      <h1>Kaban storage sync spike</h1>
      <p>Environment probe and local database spike.</p>

      <form id="pair-form">
        <fieldset>
          <legend>Pairing</legend>
          <p>
            <label for="db-url">Database URL</label>
            <input id="db-url" name="url" type="url" autocomplete="off" spellcheck="false" />
          </p>
          <p>
            <label for="db-token">Auth token</label>
            <input id="db-token" name="authToken" type="password" autocomplete="off" spellcheck="false" />
          </p>
          <button type="submit">Pair</button>
        </fieldset>
      </form>

      <div role="group" aria-label="Spike actions">
        <button type="button">Probe</button>
        <button type="button">Persist</button>
        <button type="button">Open local</button>
        <button type="button">Add ledger row</button>
        <button type="button">List rows</button>
        <button type="button">Push</button>
        <button type="button">Pull</button>
        <button type="button">Stats</button>
      </div>
      <pre id="out" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
