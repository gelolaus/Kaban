<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/syne-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Establish cascade layer order before any Vite-injected component CSS. -->
    <style>
      @layer reset, base, tokens, components, utilities;
    </style>
    <script>
      try {
        const v = localStorage.getItem('kaban:color-scheme')
        if (v === 'light' || v === 'dark')
          document.querySelector('meta[name="color-scheme"]').content = v
      } catch {}
    </script>
    <title>Kaban</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
